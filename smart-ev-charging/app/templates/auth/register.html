{% extends "base.html" %}
{% block title %}Register - EV Charge Mobile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-5">
      <h3 class="mb-3 text-center"><i class="bi bi-person-plus-fill text-success"></i> Create Account</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Register as</label>
          <select name="role" class="form-select">
            <option value="user">EV Owner (User)</option>
            <option value="driver">Charging Van Driver</option>
          </select>
          <div class="form-text">Driver accounts still need a van assigned by an admin.</div>
        </div>
        <button class="btn btn-success w-100" type="submit">Register</button>
      </form>
      <p class="text-center mt-3 mb-0">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
