{% extends "base.html" %}
{% block title %}Login - EV Charge Mobile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-5">
      <h3 class="mb-3 text-center"><i class="bi bi-lightning-charge-fill text-success"></i> Login</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-success w-100" type="submit">Login</button>
      </form>
      <p class="text-center mt-3 mb-0">
        No account? <a href="{{ url_for('auth.register') }}">Register here</a>
      </p>
      <hr>
      <p class="text-muted small text-center mb-0">
        Demo admin: <code>admin@evcharge.local</code> / <code>Admin@123</code>
      </p>
    </div>
  </div>
</div>
{% endblock %}
