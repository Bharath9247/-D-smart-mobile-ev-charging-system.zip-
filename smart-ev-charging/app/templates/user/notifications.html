{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-bell-fill"></i> Notifications</h3>
<div class="list-group">
  {% for n in notes %}
    <div class="list-group-item">
      <div class="d-flex justify-content-between">
        <span>{{ n.message }}</span>
        <small class="text-muted">{{ n.created_at.strftime('%d %b %H:%M') }}</small>
      </div>
    </div>
  {% else %}
    <div class="text-muted text-center py-4">No notifications yet.</div>
  {% endfor %}
</div>
{% endblock %}
